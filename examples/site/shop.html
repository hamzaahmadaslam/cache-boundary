<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop - Example Store</title>
<link rel="canonical" href="https://example.com/shop/">
</head>
<body class="archive post-type-archive post-type-archive-product woocommerce-shop woocommerce woocommerce-page woocommerce-no-js">
<header class="site-header">
  <a class="site-title" href="https://example.com/">Example Store</a>
  <div class="currency-switcher">
    <form method="post" class="currency-form"><label for="currency">Currency</label> <select id="currency" name="currency"><option value="USD" selected>USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option></select></form>
  </div>
</header>
<main>
  <h1 class="page-title">Shop</h1>
  <ul class="products columns-3">
    <li class="product"><a href="https://example.com/product/blue-hoodie/"><h2>Blue hoodie</h2><span class="price">$60.00</span></a></li>
    <li class="product"><a href="https://example.com/product/green-hoodie/"><h2>Green hoodie</h2><span class="price">$60.00</span></a></li>
    <li class="product"><a href="https://example.com/product/grey-zip-hoodie/"><h2>Grey zip hoodie</h2><span class="price">$72.00</span></a></li>
  </ul>
  <p>Prices are shown in the currency you choose above.</p>
</main>
</body>
</html>
